  <div id="root"></div>
  
  <link rel="modulepreload" href="app.js">
  <script type="module" src="app.js"></script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
  
  <script>
    (() => {
      const EXPERIMENT = "logicprimal_mvt_v1";
      const STORAGE_KEY = "logicprimal_mvt_v1";
      const combos = ["H0P0X0", "H0P0X1", "H0P1X0", "H0P1X1", "H1P0X0", "H1P0X1", "H1P1X0", "H1P1X1"];
      const params = new URLSearchParams(window.location.search);
      const forcedCombo = params.get("mvt");
      const isCombo = (value) => /^H[01]P[01]X[01]$/.test(value || "");
      let id = isCombo(forcedCombo) ? forcedCombo : null;
      if (!id) {
        try { id = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null")?.id; } catch (_) {}
      }
      if (!isCombo(id)) {
        id = combos[Math.floor(Math.random() * combos.length)];
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ id, assignedAt: new Date().toISOString() }));
      }
      const forcedHero = params.get("hero_variant");
      const forcedProof = params.get("proof_variant");
      const forcedExit = params.get("exit_variant");
      const mvt = {
        id,
        hero: forcedHero === "control" || forcedHero === "variant" ? forcedHero : id[1] === "1" ? "variant" : "control",
        proof: forcedProof === "control" || forcedProof === "variant" ? forcedProof : id[3] === "1" ? "variant" : "control",
        exit: forcedExit === "control" || forcedExit === "variant" ? forcedExit : id[5] === "1" ? "variant" : "control"
      };
      window.logicprimalMVT = mvt;
      document.documentElement.dataset.mvt = id;
      const payload = { event: "mvt_assignment", experiment: EXPERIMENT, combination: id, hero: mvt.hero, proof: mvt.proof, exit: mvt.exit };
      window.dispatchEvent(new CustomEvent("logicprimal:experiment", { detail: payload }));
      if (Array.isArray(window.dataLayer)) window.dataLayer.push(payload);
    })();
  </script>
  <script>
    (() => {
      const EXPERIMENT = "hero_headline_cta_v1";
      const STORAGE_KEY = "logicprimal_hero_variant_v1";
      const allowed = new Set(["control", "variant"]);
      const forcedVariant = new URLSearchParams(window.location.search).get("hero_variant");
      let variant = allowed.has(forcedVariant) ? forcedVariant : (window.logicprimalMVT?.hero || localStorage.getItem(STORAGE_KEY));
      if (!allowed.has(variant)) {
        variant = Math.random() < 0.5 ? "control" : "variant";
        localStorage.setItem(STORAGE_KEY, variant);
      }
      document.documentElement.dataset.heroVariant = variant;

      const track = (eventName) => {
        const payload = { event: eventName, experiment: EXPERIMENT, variant, combination: window.logicprimalMVT?.id || "independent" };
        const metricsKey = `${EXPERIMENT}_metrics`;
        const metrics = JSON.parse(localStorage.getItem(metricsKey) || "{}");
        metrics[eventName] = (metrics[eventName] || 0) + 1;
        localStorage.setItem(metricsKey, JSON.stringify(metrics));
        window.dispatchEvent(new CustomEvent("logicprimal:experiment", { detail: payload }));
        if (Array.isArray(window.dataLayer)) window.dataLayer.push(payload);
        if (typeof window.plausible === "function") window.plausible(eventName, { props: { experiment: EXPERIMENT, variant } });
      };

      const setExactText = (headline, from, to) => {
        headline.querySelectorAll("*").forEach((element) => {
          if (element.children.length === 0 && element.textContent.trim() === from) element.textContent = to;
        });
      };

      const applyExperiment = () => {
        const root = document.getElementById("root");
        const headline = root && root.querySelector("h1");
        if (!headline || !headline.textContent.includes("WE BUILD")) return false;
        if (variant === "variant") {
          setExactText(headline, "WE BUILD", "MAKE THEM");
          setExactText(headline, "PERSONAL", "STOP.");
          setExactText(headline, "BRANDS", "AND");
          setExactText(headline, "THAT SELL.", "BUY.");
          const cta = Array.from(root.querySelectorAll("a")).find((link) => link.textContent.trim() === "VIEW UGC REELS →");
          if (cta) {
            cta.textContent = "GET MY GROWTH MAP →";
            cta.href = "#contact";
            cta.dataset.abHeroCta = "true";
          }
        } else {
          const cta = Array.from(root.querySelectorAll("a")).find((link) => link.textContent.trim() === "VIEW UGC REELS →");
          if (cta) cta.dataset.abHeroCta = "true";
        }
        if (!sessionStorage.getItem(`${EXPERIMENT}_impression`)) {
          sessionStorage.setItem(`${EXPERIMENT}_impression`, "1");
          track("hero_impression");
        }
        return true;
      };

      const root = document.getElementById("root");
      if (root) {
        const observer = new MutationObserver(() => {
          if (applyExperiment()) observer.disconnect();
        });
        observer.observe(root, { childList: true, subtree: true });
        applyExperiment();
      }
      document.addEventListener("click", (event) => {
        const cta = event.target.closest && event.target.closest("[data-ab-hero-cta]");
        if (cta) track("hero_cta_click");
      }, true);
    })();
  </script>
  <script>
    (() => {
      const EXPERIMENT = "proof_order_v1";
      const STORAGE_KEY = "logicprimal_proof_variant_v1";
      const allowed = new Set(["control", "variant"]);
      const forcedVariant = new URLSearchParams(window.location.search).get("proof_variant");
      let variant = allowed.has(forcedVariant) ? forcedVariant : (window.logicprimalMVT?.proof || localStorage.getItem(STORAGE_KEY));
      if (!allowed.has(variant)) {
        variant = Math.random() < 0.5 ? "control" : "variant";
        localStorage.setItem(STORAGE_KEY, variant);
      }
      document.documentElement.dataset.proofVariant = variant;

      const track = (eventName) => {
        const payload = { event: eventName, experiment: EXPERIMENT, variant, combination: window.logicprimalMVT?.id || "independent" };
        const metricsKey = `${EXPERIMENT}_metrics`;
        const metrics = JSON.parse(localStorage.getItem(metricsKey) || "{}");
        metrics[eventName] = (metrics[eventName] || 0) + 1;
        localStorage.setItem(metricsKey, JSON.stringify(metrics));
        window.dispatchEvent(new CustomEvent("logicprimal:experiment", { detail: payload }));
        if (Array.isArray(window.dataLayer)) window.dataLayer.push(payload);
        if (typeof window.plausible === "function") window.plausible(eventName, { props: { experiment: EXPERIMENT, variant } });
      };

      const findMetric = (value) => [...document.querySelectorAll("#root *")].find((element) => element.children.length === 0 && element.textContent.trim() === value)?.parentElement;
      const applyExperiment = () => {
        const metrics = [findMetric("3.2x"), findMetric("180+"), findMetric("24h")];
        if (metrics.some((metric) => !metric)) return false;
        const container = metrics[0].parentElement;
        if (!container || metrics.some((metric) => metric.parentElement !== container)) return false;
        container.dataset.proofOrder = variant === "variant" ? "volume-first" : "outcome-first";
        if (variant === "variant") {
          [metrics[1], metrics[0], metrics[2]].forEach((metric) => container.appendChild(metric));
        }
        if (!sessionStorage.getItem(`${EXPERIMENT}_impression`)) {
          const observer = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              sessionStorage.setItem(`${EXPERIMENT}_impression`, "1");
              track("proof_impression");
              observer.disconnect();
            }
          }, { threshold: 0.35 });
          observer.observe(container);
        }
        return true;
      };

      const root = document.getElementById("root");
      if (root) {
        const observer = new MutationObserver(() => {
          if (applyExperiment()) observer.disconnect();
        });

      });

      const heading = document.createElement("h2");
      heading.id = `${MODAL_ID}-title`;
      heading.textContent = "UGC reel";
      Object.assign(heading.style, {
        margin: "0",
        fontSize: "clamp(18px, 3vw, 24px)",
        fontWeight: "700",
        letterSpacing: "-0.02em",
      });

      const closeButton = document.createElement("button");
      closeButton.type = "button";
      closeButton.textContent = "×";
      closeButton.setAttribute("aria-label", "Close full-screen viewer");
      Object.assign(closeButton.style, {
        display: "grid",
        placeItems: "center",
        width: "44px",
        height: "44px",
        flex: "0 0 auto",
        border: "1px solid rgba(232, 196, 138, 0.45)",
        borderRadius: "999px",
        background: "rgba(232, 196, 138, 0.16)",
        color: "#fff",
        fontSize: "28px",
        lineHeight: "1",
        cursor: "pointer",
      });
      closeButton.addEventListener("click", closeModal);
      header.append(heading, closeButton);

      const videoWrap = document.createElement("div");
      videoWrap.className = "ugc-modal-video-wrap";

      const video = document.createElement("video");
      video.className = "ugc-modal-video";
      video.controls = true;
      video.autoplay = true;
      video.muted = modalMuted;
      video.loop = true;
      video.playsInline = true;
      video.preload = "auto";
      Object.assign(video.style, {
        display: "block",
        width: "100%",
        maxHeight: "78vh",
        objectFit: "contain",
        border: "1px solid rgba(232, 196, 138, 0.3)",
        borderRadius: "18px",
        background: "#080808",
        boxShadow: "0 24px 80px rgba(0, 0, 0, 0.55)",
      });
      video.addEventListener("click", () => {
        if (suppressVideoClick) {
          suppressVideoClick = false;
          return;
        }
        if (video.paused) video.play().catch(() => {});
        else video.pause();
      });

      const createNavButton = (direction) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `ugc-modal-nav ugc-modal-nav-${direction}`;
        button.textContent = direction === "prev" ? "‹" : "›";
        button.setAttribute("aria-label", direction === "prev" ? "View previous reel" : "View next reel");
        return button;
      };
      const previousButton = createNavButton("prev");
      const nextButton = createNavButton("next");
      videoWrap.append(video, previousButton, nextButton);

      const footer = document.createElement("div");
      footer.className = "ugc-modal-footer";
      Object.assign(footer.style, {
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        gap: "12px",
        width: "100%",
        flexWrap: "wrap",
      });

      const description = document.createElement("p");
      description.id = `${MODAL_ID}-description`;
      description.textContent = "";
      Object.assign(description.style, {
        margin: "0",
        flex: "1 1 220px",
        color: "rgba(255, 255, 255, 0.68)",
        fontSize: "13px",
        lineHeight: "1.5",
      });

      const counter = document.createElement("span");
      counter.className = "ugc-modal-counter";
      counter.setAttribute("aria-live", "polite");

      const soundButton = document.createElement("button");
      soundButton.type = "button";
      soundButton.className = "ugc-modal-sound";
      soundButton.textContent = "SOUND OFF";
      soundButton.setAttribute("aria-label", "Unmute video");
      soundButton.addEventListener("click", () => {
        modalMuted = !modalMuted;
        video.muted = modalMuted;
        soundButton.textContent = modalMuted ? "SOUND OFF" : "SOUND ON";
        soundButton.setAttribute("aria-label", modalMuted ? "Unmute video" : "Mute video");
        video.play().catch(() => {});
      });

      const fullscreenButton = document.createElement("button");
      fullscreenButton.type = "button";
      fullscreenButton.className = "ugc-modal-fullscreen";
      fullscreenButton.textContent = "FULL SCREEN ↗";
      fullscreenButton.setAttribute("aria-label", "Enter browser full-screen mode");
      Object.assign(fullscreenButton.style, {
        minHeight: "40px",
        padding: "0 16px",
        border: "1px solid rgba(232, 196, 138, 0.5)",
        borderRadius: "999px",
        background: "#e8c48a",
        color: "#080808",
        fontSize: "11px",
        fontWeight: "700",
        letterSpacing: "0.08em",
        cursor: "pointer",
      });
      fullscreenButton.addEventListener("click", async () => {
        const request = video.requestFullscreen || video.webkitRequestFullscreen;
        if (request) {
          try {
            await request.call(video);
          } catch (_) {
            // Native controls remain available if browser full-screen is unavailable.
          }
        }
      });
      footer.append(description, counter, soundButton, fullscreenButton);

      const showByIndex = (nextIndex) => {
        const triggers = getTriggers();
        if (!triggers.length) return;
        currentIndex = (nextIndex + triggers.length) % triggers.length;
        const triggerForIndex = triggers[currentIndex];
        lastTrigger = triggerForIndex;
        const title = triggerForIndex.dataset.reelTitle || `UGC Ad ${currentIndex + 1}`;
        const hook = triggerForIndex.dataset.reelHook || "Watch the selected UGC reel.";
        heading.textContent = title;
        heading.id = `${MODAL_ID}-title`;
        description.textContent = hook;
        video.setAttribute("aria-label", `${title} video player; tap to pause or play`);
        video.muted = modalMuted;
        video.src = triggerForIndex.dataset.reelSrc || "";
        video.load();
        video.play().catch(() => {});
        if (canPreloadAhead()) {
          const nextTrigger = triggers[currentIndex + 1];
          if (nextTrigger) warmVideo(nextTrigger.dataset.reelSrc);
        }
        soundButton.textContent = modalMuted ? "SOUND OFF" : "SOUND ON";
        soundButton.setAttribute("aria-label", modalMuted ? "Unmute video" : "Mute video");
        counter.textContent = `${currentIndex + 1} / ${triggers.length}`;
        previousButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === triggers.length - 1;
      };

      previousButton.addEventListener("click", () => showByIndex(currentIndex - 1));
      nextButton.addEventListener("click", () => showByIndex(currentIndex + 1));

      videoWrap.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1) return;
        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
        touchActive = true;
      }, { passive: true });
      videoWrap.addEventListener("touchend", (event) => {
        if (!touchActive || !event.changedTouches.length) return;
        touchActive = false;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;
        if (Math.abs(deltaX) < SWIPE_THRESHOLD || Math.abs(deltaX) <= Math.abs(deltaY) * 1.2) return;
        suppressVideoClick = true;
        window.setTimeout(() => { suppressVideoClick = false; }, 0);
        showByIndex(currentIndex + (deltaX < 0 ? 1 : -1));
      }, { passive: true });

      panel.append(header, videoWrap, footer);
      modal.append(panel);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });
      document.body.append(modal);
      document.body.style.overflow = "hidden";
      showByIndex(getTriggers().indexOf(trigger));
      closeButton.focus();
    };

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest && event.target.closest("[data-reel-src]");
      if (trigger) {
        event.preventDefault();
        openModal(trigger);
      }
    });

    document.addEventListener("keydown", (event) => {
      const modal = document.getElementById(MODAL_ID);
      if (!modal) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeModal();
        return;
      }
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        const next = modal.querySelector(".ugc-modal-nav-prev");
        if (next && !next.disabled) next.click();
        return;
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        const next = modal.querySelector(".ugc-modal-nav-next");
        if (next && !next.disabled) next.click();
        return;
      }
      if (event.key === "Tab") {
        const focusable = getFocusable(modal);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });

    const root = document.getElementById("root");
    const startPreviewObserver = () => {
      initPreviewPlayback();
      if (root && !root.dataset.previewObserverBound) {
        root.dataset.previewObserverBound = "true";
        const observer = new MutationObserver(() => initPreviewPlayback());
        observer.observe(root, { childList: true, subtree: true });
      }
    };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startPreviewObserver, { once: true });
    else startPreviewObserver();
  })();
</script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
      });
    }
  </script>
</body>
